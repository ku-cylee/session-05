<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>게시판</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e4e7ec;
      --text: #1f2430;
      --muted: #6b7280;
      --accent: #3b5bdb;
      --accent-soft: #eef1fc;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 16px rgba(16, 24, 40, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .site-header .container {
      display: flex;
      align-items: center;
      height: 60px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
    }

    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
    }

    main.container {
      padding-top: 32px;
      padding-bottom: 64px;
    }

    .page-title {
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .page-sub {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .page-sub code {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 13px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .article {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 40px;
      box-shadow: var(--shadow);
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 22px;
    }

    .field label {
      font-weight: 600;
      font-size: 14.5px;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 11px 14px;
      font: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field textarea {
      min-height: 180px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .field .hint {
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .submit {
      padding: 10px 22px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      transition: filter 0.15s;
    }

    .submit:hover {
      filter: brightness(1.08);
    }

    @media (max-width: 560px) {
      .article {
        padding: 26px 22px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <span class="brand">
        <span class="brand-mark">B</span>
        <span>게시판</span>
      </span>
    </div>
  </header>
  <main class="container">
    <h1 class="page-title">새 글 작성</h1>
    <p class="page-sub">제출하면 <code>POST /api/posts</code>로 보내지고, 서버의 응답이 이 페이지를 대체합니다.</p>
    <form class="article" method="POST" action="/api/posts">
      <div class="field">
        <label for="title">제목</label>
        <input id="title" name="title" maxlength="100" required placeholder="100자 이내" />
        <span class="hint">필수 · 최대 100자</span>
      </div>
      <div class="field">
        <label for="content">내용</label>
        <textarea id="content" name="content" required placeholder="본문을 입력하세요"></textarea>
        <span class="hint">필수</span>
      </div>
      <div class="actions">
        <button class="submit">등록</button>
      </div>
    </form>
  </main>
</body>
</html>
